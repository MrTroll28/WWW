<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employees</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Company Manager</a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" th:href="@{/departments}">Departments</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/employees}">Employees</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Employees</h2>
        <a class="btn btn-primary" th:href="@{/employees/create}">+ Add Employee</a>
    </div>

    <form class="row g-2 mb-4" method="get" th:action="@{/employees}">
        <div class="col-auto">
            <input type="text" class="form-control" name="name" placeholder="Search by name"
                   th:value="${param.name}">
        </div>
        <div class="col-auto">
            <select name="departmentId" class="form-select">
                <option value="" th:selected="${param.departmentId == null}">All Departments</option>
                <option th:each="dept : ${departments}"
                        th:value="${dept.deptId}"
                        th:text="${dept.deptName}"
                        th:selected="${dept.deptId} == ${param.departmentId}">
                </option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-secondary">Filter</button>
        </div>
    </form>

    <table class="table table-bordered table-hover">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>DOB</th>
            <th>Salary</th>
            <th>Department</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="emp : ${employees}">
            <td th:text="${emp.empId}"></td>
            <td th:text="${emp.empName}"></td>
            <td th:text="${emp.dob}"></td>
            <td th:text="${emp.salary}"></td>
            <td th:text="${emp.department != null ? emp.department.deptName : 'N/A'}"></td>
            <td>
                <a class="btn btn-sm btn-warning" th:href="@{'/employees/' + ${emp.empId} + '/edit'}">Edit</a>
                <form th:action="@{'/employees/' + ${emp.empId} + '/delete'}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-danger"
                            onclick="return confirm('Are you sure you want to delete this employee?');">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(employees)}">
            <td colspan="6" class="text-center">No employees found.</td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
</body>
</html>
