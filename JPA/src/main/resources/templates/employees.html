<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Employees</title></head>
<body>
<h2>Employee List</h2>
<a href="/employees/add">+ Add Employee</a>
<table border="1" cellpadding="6">
    <tr>
        <th>ID</th><th>Name</th><th>Salary</th><th>DOB</th><th>Department</th><th>Action</th>
    </tr>
    <tr th:each="e : ${employees}">
        <td th:text="${e.empId}"></td>
        <td th:text="${e.empName}"></td>
        <td th:text="${e.salary}"></td>
        <td th:text="${e.dob}"></td>
        <td th:text="${e.department != null ? e.department.deptName : 'N/A'}"></td>
        <td>
            <a th:href="@{/employees/edit/{id}(id=${e.empId})}">Edit</a> |
            <a th:href="@{/employees/delete/{id}(id=${e.empId})}">Delete</a>
        </td>
    </tr>
</table>
</body>
</html>
