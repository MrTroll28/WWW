<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Add/Edit Employee</title></head>
<body>
<h2 th:text="${employee.empId == null} ? 'Add Employee' : 'Edit Employee'"></h2>

<form th:action="@{/employees/save}" th:object="${employee}" method="post">
    <input type="hidden" th:field="*{empId}" />
    Name: <input type="text" th:field="*{empName}" required /><br/>
    Salary: <input type="number" step="0.01" th:field="*{salary}" required /><br/>
    DOB: <input type="date" th:field="*{dob}" required /><br/>
    Department:
    <select th:field="*{department.deptId}">
        <option th:each="d : ${departments}" th:value="${d.deptId}" th:text="${d.deptName}"></option>
    </select><br/>
    <button type="submit">Save</button>
</form>

<a href="/employees">Back</a>
</body>
</html>
