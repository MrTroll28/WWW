<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Departments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Company Manager</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/departments}">Departments</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/employees}">Employees</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div th:if="${success}" class="alert alert-success" role="alert" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Departments</h2>
        <a class="btn btn-primary" th:href="@{/departments/create}">+ Add Department</a>
    </div>

    <form class="row g-2 mb-4" th:action="@{/departments}" method="get">
        <div class="col-auto">
            <input type="text" class="form-control" name="name" placeholder="Search by name"
                   th:value="${param.name}">
        </div>
        <div class="col-auto">
            <input type="number" min="0" class="form-control" name="minSize" placeholder="Min employees"
                   th:value="${param.minSize}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-secondary">Filter</button>
        </div>
    </form>

    <table class="table table-bordered table-hover">
        <thead class="table-light">
        <tr>
            <th scope="col">ID</th>
            <th scope="col">Name</th>
            <th scope="col">Employees</th>
            <th scope="col">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="dept : ${departments}">
            <td th:text="${dept.deptId}"></td>
            <td th:text="${dept.deptName}"></td>
            <td th:text="${#lists.size(dept.employees)}"></td>
            <td>
                <a class="btn btn-sm btn-warning" th:href="@{'/departments/' + ${dept.deptId} + '/edit'}">Edit</a>
                <form th:action="@{'/departments/' + ${dept.deptId} + '/delete'}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-danger"
                            onclick="return confirm('Are you sure you want to delete this department?');">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(departments)}">
            <td colspan="4" class="text-center">No departments found.</td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
</body>
</html>
