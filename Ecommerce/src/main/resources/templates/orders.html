<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Your Orders</title>
    <link th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}" rel="stylesheet"/>
    <script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}" defer></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">E‑commerce</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/cart(customerId=${customerId})}">Cart</a></li>
                <li class="nav-item"><a class="nav-link active" aria-current="page" th:href="@{/orders(customerId=${customerId})}">Orders</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/register}">Register</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/login}">Login</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1>Your Orders</h1>
    <div th:if="${orders.isEmpty()}">
        <p>You have no orders yet.</p>
    </div>
    <div th:each="order : ${orders}">
        <div class="card mb-3">
            <div class="card-header">
                <strong>Order #<span th:text="${order.id}"></span></strong> -
                <span th:text="${order.orderDate}"></span>
                <span class="badge bg-secondary" th:text="${order.status}"></span>
            </div>
            <div class="card-body">
                <table class="table table-sm">
                    <thead>
                    <tr>
                        <th>Product</th>
                        <th>Quantity</th>
                        <th>Price</th>
                        <th>Subtotal</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="line : ${order.orderLines}">
                        <td th:text="${line.product.name}"></td>
                        <td th:text="${line.quantity}"></td>
                        <td th:text="${#numbers.formatDecimal(line.price,1,2)}"></td>
                        <td th:text="${#numbers.formatDecimal(line.price * line.quantity,1,2)}"></td>
                    </tr>
                    </tbody>
                </table>
                <div class="text-end">
                    <strong>Total:</strong> <span th:text="${#numbers.formatDecimal(order.total,1,2)}"></span>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
