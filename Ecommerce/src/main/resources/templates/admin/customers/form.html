<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thông tin khách hàng</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}" />
</head>
<body class="container py-4">
<h1 class="mb-4" th:text="${customer.id == null} ? 'Thêm khách hàng' : 'Cập nhật khách hàng'"></h1>
<form th:action="@{/admin/customers}" th:object="${customer}" method="post" class="row g-3">
    <input type="hidden" th:field="*{id}">
    <div class="col-md-6">
        <label class="form-label">Họ</label>
        <input class="form-control" th:field="*{firstName}" required>
    </div>
    <div class="col-md-6">
        <label class="form-label">Tên</label>
        <input class="form-control" th:field="*{lastName}" required>
    </div>
    <div class="col-md-6">
        <label class="form-label">Email</label>
        <input class="form-control" th:field="*{email}" type="email" required>
    </div>
    <div class="col-md-6">
        <label class="form-label">Điện thoại</label>
        <input class="form-control" th:field="*{phone}">
    </div>
    <div class="col-12">
        <label class="form-label">Địa chỉ</label>
        <input class="form-control" th:field="*{address}">
    </div>
    <div class="col-12">
        <button class="btn btn-primary" type="submit">Lưu</button>
        <a class="btn btn-secondary" th:href="@{/admin/customers}">Hủy</a>
    </div>
</form>
</body>
</html>
