<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết khách hàng</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}" />
</head>
<body class="container py-4">
<h1 class="mb-4">Chi tiết khách hàng</h1>
<div class="card mb-4">
    <div class="card-body">
        <h5 class="card-title" th:text="${customer.firstName + ' ' + customer.lastName}"></h5>
        <p class="card-text"><strong>Email:</strong> <span th:text="${customer.email}"></span></p>
        <p class="card-text"><strong>Điện thoại:</strong> <span th:text="${customer.phone}"></span></p>
        <p class="card-text"><strong>Địa chỉ:</strong> <span th:text="${customer.address}"></span></p>
    </div>
</div>
<h2 class="h4">Đơn hàng</h2>
<table class="table table-bordered">
    <thead>
    <tr>
        <th>Mã hóa đơn</th>
        <th>Ngày đặt</th>
        <th>Trạng thái</th>
        <th>Tổng tiền</th>
        <th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="order : ${orders}">
        <td th:text="${order.id}"></td>
        <td th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}"></td>
        <td th:text="${order.status}"></td>
        <td th:text="${#numbers.formatDecimal(order.total, 1, 'POINT', 2, 'POINT')}"></td>
        <td class="text-end">
            <a class="btn btn-sm btn-primary" th:href="@{|/admin/orders/${order.id}|}">Xem chi tiết</a>
        </td>
    </tr>
    <tr th:if="${orders.isEmpty()}">
        <td colspan="5" class="text-center">Khách hàng chưa có hóa đơn nào</td>
    </tr>
    </tbody>
</table>
<a class="btn btn-secondary" th:href="@{/admin/customers}">Quay lại danh sách</a>
</body>
</html>
