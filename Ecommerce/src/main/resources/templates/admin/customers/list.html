<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý khách hàng</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}" />
</head>
<body class="container py-4">
<h1 class="mb-4">Quản lý khách hàng</h1>
<div class="mb-3 d-flex justify-content-between">
    <form class="d-flex" method="get">
        <input class="form-control me-2" type="search" placeholder="Tên, email hoặc số điện thoại" name="keyword" th:value="${keyword}">
        <button class="btn btn-outline-primary" type="submit">Tìm kiếm</button>
    </form>
    <a class="btn btn-primary" th:href="@{/admin/customers/new}">Thêm khách hàng</a>
</div>
<table class="table table-hover">
    <thead>
    <tr>
        <th>ID</th>
        <th>Họ tên</th>
        <th>Email</th>
        <th>Điện thoại</th>
        <th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="customer : ${customers}">
        <td th:text="${customer.id}"></td>
        <td th:text="${customer.firstName + ' ' + customer.lastName}"></td>
        <td th:text="${customer.email}"></td>
        <td th:text="${customer.phone}"></td>
        <td class="text-end">
            <a class="btn btn-sm btn-info" th:href="@{|/admin/customers/${customer.id}|}">Chi tiết</a>
            <a class="btn btn-sm btn-secondary" th:href="@{|/admin/customers/${customer.id}/edit|}">Sửa</a>
            <form th:action="@{|/admin/customers/${customer.id}/delete|}" method="post" class="d-inline">
                <button class="btn btn-sm btn-danger" type="submit" onclick="return confirm('Xóa khách hàng này?');">Xóa</button>
            </form>
        </td>
    </tr>
    <tr th:if="${customers.isEmpty()}">
        <td colspan="5" class="text-center">Không tìm thấy khách hàng phù hợp</td>
    </tr>
    </tbody>
</table>
</body>
</html>
