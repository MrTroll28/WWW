<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thông tin sản phẩm</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}" />
</head>
<body class="container py-4">
<h1 class="mb-4" th:text="${product.id == null} ? 'Thêm sản phẩm' : 'Cập nhật sản phẩm'"></h1>
<form th:action="@{/admin/products}" th:object="${product}" method="post" class="row g-3">
    <input type="hidden" th:field="*{id}">
    <div class="col-md-6">
        <label class="form-label">Tên</label>
        <input class="form-control" th:field="*{name}" required>
    </div>
    <div class="col-md-6">
        <label class="form-label">Giá</label>
        <input class="form-control" th:field="*{price}" type="number" min="0" step="0.01" required>
    </div>
    <div class="col-12">
        <label class="form-label">Mô tả</label>
        <textarea class="form-control" th:field="*{description}" rows="4"></textarea>
    </div>
    <div class="col-md-4">
        <label class="form-label">Tồn kho</label>
        <input class="form-control" th:field="*{stock}" type="number" min="0" required>
    </div>
    <div class="col-12">
        <button class="btn btn-primary" type="submit">Lưu</button>
        <a class="btn btn-secondary" th:href="@{/admin/products}">Hủy</a>
    </div>
</form>
</body>
</html>
