<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý hóa đơn</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}" />
</head>
<body class="container py-4">
<h1 class="mb-4">Quản lý hóa đơn</h1>
<div class="mb-3 d-flex justify-content-between">
    <form class="d-flex" method="get">
        <input class="form-control me-2" type="search" placeholder="Mã hóa đơn, khách hàng, trạng thái" name="keyword" th:value="${keyword}">
        <button class="btn btn-outline-primary" type="submit">Tìm kiếm</button>
    </form>
    <a class="btn btn-primary" th:href="@{/admin/orders/new}">Tạo hóa đơn</a>
</div>
<table class="table table-striped">
    <thead>
    <tr>
        <th>Mã hóa đơn</th>
        <th>Khách hàng</th>
        <th>Ngày tạo</th>
        <th>Trạng thái</th>
        <th>Tổng tiền</th>
        <th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="order : ${orders}">
        <td th:text="${order.id}"></td>
        <td th:text="${order.customer != null ? order.customer.firstName + ' ' + order.customer.lastName : ''}"></td>
        <td th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}"></td>
        <td th:text="${order.status}"></td>
        <td th:text="${#numbers.formatDecimal(order.total, 1, 'POINT', 2, 'POINT')}"></td>
        <td class="text-end">
            <a class="btn btn-sm btn-primary" th:href="@{|/admin/orders/${order.id}|}">Chi tiết</a>
            <form th:action="@{|/admin/orders/${order.id}/delete|}" method="post" class="d-inline">
                <button class="btn btn-sm btn-danger" type="submit" onclick="return confirm('Xóa hóa đơn này?');">Xóa</button>
            </form>
        </td>
    </tr>
    <tr th:if="${orders.isEmpty()}">
        <td colspan="6" class="text-center">Không tìm thấy hóa đơn phù hợp</td>
    </tr>
    </tbody>
</table>
</body>
</html>
