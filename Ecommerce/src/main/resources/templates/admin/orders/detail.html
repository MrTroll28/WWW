<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết hóa đơn</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}" />
</head>
<body class="container py-4">
<h1 class="mb-4">Chi tiết hóa đơn #<span th:text="${order.id}"></span></h1>
<div class="row mb-4">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Thông tin khách hàng</h5>
                <p class="card-text"><strong>Tên:</strong> <span th:text="${order.customer.firstName + ' ' + order.customer.lastName}"></span></p>
                <p class="card-text"><strong>Email:</strong> <span th:text="${order.customer.email}"></span></p>
                <p class="card-text"><strong>Điện thoại:</strong> <span th:text="${order.customer.phone}"></span></p>
                <a class="btn btn-link p-0" th:href="@{|/admin/customers/${order.customer.id}|}">Xem khách hàng</a>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Thông tin hóa đơn</h5>
                <p class="card-text"><strong>Ngày tạo:</strong> <span th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}"></span></p>
                <form th:action="@{|/admin/orders/${order.id}/update|}" method="post" class="row g-2 align-items-center">
                    <div class="col-auto">
                        <label class="col-form-label"><strong>Trạng thái:</strong></label>
                    </div>
                    <div class="col-auto">
                        <input class="form-control" name="status" th:value="${order.status}">
                    </div>
                    <div class="col-auto">
                        <button class="btn btn-primary" type="submit">Cập nhật</button>
                    </div>
                </form>
                <p class="mt-3"><strong>Tổng tiền:</strong> <span th:text="${#numbers.formatDecimal(order.total, 1, 'POINT', 2, 'POINT')}"></span></p>
            </div>
        </div>
    </div>
</div>
<h2 class="h4">Chi tiết hóa đơn</h2>
<table class="table table-bordered align-middle">
    <thead>
    <tr>
        <th>Sản phẩm</th>
        <th>Số lượng</th>
        <th>Đơn giá</th>
        <th>Thành tiền</th>
        <th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="line : ${order.orderLines}">
        <td th:text="${line.product != null ? line.product.name : ''}"></td>
        <td th:text="${line.quantity}"></td>
        <td th:text="${#numbers.formatDecimal(line.price, 1, 'POINT', 2, 'POINT')}"></td>
        <td th:text="${#numbers.formatDecimal(line.subtotal, 1, 'POINT', 2, 'POINT')}"></td>
        <td class="text-end">
            <a class="btn btn-sm btn-secondary" th:href="@{|/admin/orders/${order.id}/lines/${line.id}/edit|}">Sửa</a>
            <form th:action="@{|/admin/orders/${order.id}/lines/${line.id}/delete|}" method="post" class="d-inline">
                <button class="btn btn-sm btn-danger" type="submit" onclick="return confirm('Xóa dòng hóa đơn này?');">Xóa</button>
            </form>
        </td>
    </tr>
    <tr th:if="${order.orderLines.isEmpty()}">
        <td colspan="5" class="text-center">Chưa có chi tiết hóa đơn</td>
    </tr>
    </tbody>
</table>
<div class="card mt-4">
    <div class="card-body">
        <h5 class="card-title">Thêm chi tiết hóa đơn</h5>
        <form th:action="@{|/admin/orders/${order.id}/lines|}" method="post" class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Sản phẩm</label>
                <select class="form-select" name="productId" required>
                    <option value="">-- Chọn sản phẩm --</option>
                    <option th:each="product : ${products}" th:value="${product.id}" th:text="${product.name}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Số lượng</label>
                <input class="form-control" name="quantity" type="number" min="1" value="1" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Đơn giá</label>
                <input class="form-control" name="price" type="number" min="0" step="0.01">
            </div>
            <div class="col-12">
                <button class="btn btn-success" type="submit">Thêm</button>
            </div>
        </form>
    </div>
</div>
<a class="btn btn-secondary mt-3" th:href="@{/admin/orders}">Quay lại danh sách</a>
</body>
</html>
