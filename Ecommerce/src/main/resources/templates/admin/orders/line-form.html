<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cập nhật chi tiết hóa đơn</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}" />
</head>
<body class="container py-4">
<h1 class="mb-4">Cập nhật chi tiết hóa đơn</h1>
<form th:action="@{|/admin/orders/${order.id}/lines/${orderLine.id}/update|}" method="post" class="row g-3">
    <div class="col-md-6">
        <label class="form-label">Sản phẩm</label>
        <select class="form-select" name="productId" required>
            <option th:each="product : ${products}" th:value="${product.id}" th:selected="${product.id == orderLine.product.id}" th:text="${product.name}"></option>
        </select>
    </div>
    <div class="col-md-3">
        <label class="form-label">Số lượng</label>
        <input class="form-control" name="quantity" type="number" min="1" th:value="${orderLine.quantity}" required>
    </div>
    <div class="col-md-3">
        <label class="form-label">Đơn giá</label>
        <input class="form-control" name="price" type="number" min="0" step="0.01" th:value="${orderLine.price}" required>
    </div>
    <div class="col-12">
        <button class="btn btn-primary" type="submit">Lưu</button>
        <a class="btn btn-secondary" th:href="@{|/admin/orders/${order.id}|}">Hủy</a>
    </div>
</form>
</body>
</html>
