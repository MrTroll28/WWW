<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${product.name}">Product Detail</title>
    <link th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}" rel="stylesheet"/>
    <script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}" defer></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">E‑commerce</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/cart?customerId=1}">Cart</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/orders?customerId=1}">Orders</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/register}">Register</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/login}">Login</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row">
        <div class="col-md-6">
            <h2 th:text="${product.name}"></h2>
            <p th:text="${product.description}"></p>
            <p><strong>Price:</strong> <span th:text="${#numbers.formatDecimal(product.price,1,2)}"></span> USD</p>
            <p><strong>Stock:</strong> <span th:text="${product.stock}"></span></p>
            <!-- Form to add product to cart -->
            <form th:action="@{/products/{id}/addToCart(id=${product.id})}" method="post" class="row g-3">
                <input type="hidden" name="customerId" value="1"/>
                <div class="col-auto">
                    <input type="number" name="quantity" min="1" value="1" class="form-control"/>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-success">Add to Cart</button>
                </div>
            </form>
        </div>
        <div class="col-md-6">
            <h4>Comments</h4>
            <div th:if="${comments.isEmpty()}">
                <p>No comments yet.</p>
            </div>
            <div class="list-group" th:each="comment : ${comments}">
                <div class="list-group-item">
                    <small class="text-muted" th:text="${comment.createdAt}"></small>
                    <p th:text="${comment.content}"></p>
                    <p><em th:text="${comment.customer.firstName + ' ' + comment.customer.lastName}"></em></p>
                </div>
            </div>
            <!-- Form to add a comment -->
            <form th:action="@{/products/{id}/comment(id=${product.id})}" method="post" class="mt-3">
                <input type="hidden" name="customerId" value="1"/>
                <div class="mb-3">
                    <label for="commentText" class="form-label">Your Comment</label>
                    <textarea id="commentText" name="content" class="form-control" rows="3" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Submit Comment</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
