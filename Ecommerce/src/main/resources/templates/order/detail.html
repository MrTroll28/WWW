<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <h3>Chi tiết đơn hàng #<span th:text="${order.id}"></span></h3>

    <p><strong>Khách hàng:</strong> <span th:text="${order.customer.name}"></span></p>
    <p><strong>Ngày đặt:</strong> <span th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}"></span></p>
    <p><strong>Trạng thái:</strong> <span th:text="${order.status}"></span></p>

    <h5 class="mt-3">Sản phẩm</h5>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>Tên sản phẩm</th>
            <th>Số lượng</th>
            <th>Giá</th>
            <th>Tổng</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="i : ${order.orderLines}">
            <td>
                <a th:href="@{'/products/' + ${i.product.id}}" th:text="${i.product.name}"></a>
            </td>
            <td th:text="${i.quantity}"></td>
            <td th:text="${#numbers.formatDecimal(i.price,1,0)} + ' ₫'"></td>
            <td th:text="${#numbers.formatDecimal(i.price * i.quantity,1,0)} + ' ₫'"></td>
        </tr>
        </tbody>
    </table>

    <div class="text-end mt-3">
        <p class="fw-bold">
            Tổng cộng:
            <span th:text="${#numbers.formatDecimal(order.total,1,0)} + ' ₫'"></span>
        </p>
    </div>

    <a href="/order/list" class="btn btn-secondary">← Quay lại</a>
</div>
</body>
</html>
