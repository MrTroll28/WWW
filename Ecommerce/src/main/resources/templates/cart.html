<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Shopping Cart</title>
    <link th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}" rel="stylesheet"/>
    <script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}" defer></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">E‑commerce</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                <li class="nav-item"><a class="nav-link active" aria-current="page" th:href="@{/cart(customerId=${customerId})}">Cart</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/orders(customerId=${customerId})}">Orders</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/register}">Register</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/login}">Login</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1>Your Cart</h1>
    <div th:if="${cart.empty}">
        <p>Your cart is empty.</p>
    </div>
    <div th:if="${!cart.empty}">
        <table class="table table-bordered">
            <thead>
            <tr>
                <th>Product</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Subtotal</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${cart.allItems}">
                <td th:text="${item.productName}"></td>
                <td>
                    <form th:action="@{/cart/update}" method="post" class="d-flex">
                        <input type="hidden" name="customerId" th:value="${customerId}"/>
                        <input type="hidden" name="productId" th:value="${item.productId}"/>
                        <input type="number" name="quantity" min="1" th:value="${item.quantity}" class="form-control me-2" style="width:80px;"/>
                        <button type="submit" class="btn btn-sm btn-primary">Update</button>
                    </form>
                </td>
                <td th:text="${#numbers.formatDecimal(item.price,1,2)}"></td>
                <td th:text="${#numbers.formatDecimal(item.total,1,2)}"></td>
                <td>
                    <form th:action="@{/cart/remove}" method="post">
                        <input type="hidden" name="customerId" th:value="${customerId}"/>
                        <input type="hidden" name="productId" th:value="${item.productId}"/>
                        <button type="submit" class="btn btn-sm btn-danger">Remove</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="d-flex justify-content-end">
            <form th:action="@{/cart/checkout}" method="post">
                <input type="hidden" name="customerId" th:value="${customerId}"/>
                <button type="submit" class="btn btn-success me-2">Checkout</button>
            </form>
            <a th:href="@{/cart/clear(customerId=${customerId})}" class="btn btn-secondary">Clear Cart</a>
        </div>
    </div>
</div>

</body>
</html>
