<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<body>
<div th:fragment="content" th:object="${p}">
    <h3 th:text="*{name}"></h3>
    <p th:text="*{description}"></p>
    <p><strong>Giá:</strong> <span th:text="*{price} + ' ₫'"></span></p>

    <form th:action="@{/cart/add}" method="post" class="d-flex gap-2">
        <input type="hidden" name="productId" th:value="*{id}">
        <input type="number" name="qty" min="1" value="1" class="form-control" style="max-width:120px;">
        <button class="btn btn-primary">Thêm vào giỏ</button>
    </form>

    <hr>
    <h5>Bình luận</h5>
    <div th:if="${#lists.isEmpty(comments)}">Chưa có bình luận nào.</div>
    <div th:each="c : ${comments}" class="border-bottom mb-2 pb-2">
        <p class="mb-1"><b th:text="${c.customer.name}"></b></p>
        <p class="mb-0" th:text="${c.content}"></p>
        <small class="text-muted" th:text="${#temporals.format(c.createdAt, 'dd/MM/yyyy HH:mm')}"></small>
    </div>

    <div sec:authorize="isAuthenticated()" class="mt-3">
        <form th:action="@{|/products/${p.id}/comment|}" method="post">
            <textarea class="form-control mb-2" name="content" rows="2" placeholder="Viết bình luận..." required></textarea>
            <button class="btn btn-outline-primary">Gửi bình luận</button>
        </form>
    </div>
</div>
</body>
</html>
